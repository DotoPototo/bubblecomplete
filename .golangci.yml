version: "2"

run:
  concurrency: 4
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  default: standard
  enable:
    # Correctness
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - nilerr
    - nilnesserr
    - predeclared
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - wastedassign

    # Style / readability that pulls weight here
    - dupword
    - gocritic
    - gosmopolitan
    - misspell
    - recvcheck
    - unconvert
    - unparam
    - usestdlibvars

    # Modernization
    - exptostd
    - intrange

    # Performance with low FP rate
    - perfsprint
    - prealloc

    # Security
    - bidichk
    - gosec

    # //nolint hygiene
    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
      # Close/Fprintf/cleanup-Remove on error paths or in defers carry
      # no actionable signal at this site — every call here is either
      # already wrapped or part of an atomic-write cleanup path where
      # the primary error is what matters.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - os.Remove
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # errcheck covers unhandled errors with better signal.
        - G104
        # Tests intentionally use looser file modes for fixtures; the
        # rule applies in prod code only, where we already chmod 0o600.
        - G302
        - G306
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    rules:
      # Bubble Tea's Update pattern uses value receivers that return the
      # mutated model; the public Set* helpers necessarily use pointer
      # receivers. The mixed shape is intentional, not a bug.
      - text: "the methods of \"(Model|Command|Flag|PositionalArgument)\""
        linters: [recvcheck]

      # Test fixtures don't need every lint applied. Suppress the noisy
      # ones rather than introducing per-line nolint comments everywhere.
      - path: _test\.go
        linters:
          - errcheck
          - forcetypeassert
          - gosec
          - gosmopolitan
          - perfsprint
          - unparam

      # Key handler signatures all return (Model, tea.Cmd) for uniformity
      # with Bubble Tea conventions, even where the current implementation
      # never produces a Cmd.
      - path: bubblecomplete\.go
        text: "result 1 \\(charm.land/bubbletea/v2.Cmd\\) is always nil"
        linters: [unparam]

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
